name: Build and publish MiniRSS for Windows
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Extract project archive
        shell: pwsh
        run: Expand-Archive -LiteralPath "MiniRSS_Windows_Project_v1.3.0_upload.zip" -DestinationPath "project"
      - name: Install, test, build and package
        shell: pwsh
        run: |
          $project = Join-Path $PWD "project/minirss_windows"
          python -m pip install --upgrade pip
          python -m pip install -r "$project/requirements.txt"
          Push-Location $project
          try {
            python check_release_version.py
            python -m unittest discover -s tests -v
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiniRSS --icon=assets/minirss.ico --add-data "assets;assets" --collect-all pystray --collect-all winotify --collect-all PIL --hidden-import winotify mini_rss.py
            python create_update_package.py
          } finally {
            Pop-Location
          }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MiniRSS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            project/minirss_windows/release/MiniRSS_*_win64.zip
            project/minirss_windows/release/MiniRSS_*_win64.zip.sha256
