name: Build and publish MiniRSS for Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Read application version
        id: app_version
        shell: pwsh
        run: |
          $source = Get-Content mini_rss.py -Raw
          $match = [regex]::Match($source, '(?m)^APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION was not found in mini_rss.py" }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python check_release_version.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiniRSS --icon=assets/minirss.ico --add-data "assets;assets" --collect-all pystray --collect-all winotify --collect-all PIL --hidden-import winotify mini_rss.py
      - name: Create update package
        run: python create_update_package.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler ISCC.exe was not found" }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          $installer = Get-ChildItem "release\MiniRSS_Setup_*_x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "The MiniRSS setup executable was not created" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath ($installer.FullName + ".sha256") -Encoding ascii
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: MiniRSS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          generate_release_notes: true
          files: |
            release/MiniRSS_*_win64.zip
            release/MiniRSS_*_win64.zip.sha256
            release/MiniRSS_Setup_*_x64.exe
            release/MiniRSS_Setup_*_x64.exe.sha256
